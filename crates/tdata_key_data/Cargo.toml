[package]
name = "tdata_key_data"
version = "0.1.0"
edition = "2024"

[dependencies]
crypto_aes_ige = { path = "../crypto_aes_ige" }
crypto_kdf = { path = "../crypto_kdf" }
argon2 = "0.5"
md-5 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
scrypt = { version = "0.11", default-features = false }
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"